<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理 - 师徒关系树</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { background: white; padding: 20px; border-radius: 8px; }
        input, select { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px 16px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        .btn-add { background: #28a745; }
        .btn-edit { background: #007bff; }
        .btn-del { background: #dc3545; }
        .btn-logout { background: #6c757d; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="header">
        <h1>人员管理</h1>
        <div>
            <button class="btn-logout" onclick="location.href='index.html'">查看树状图</button>
            <button class="btn-logout" onclick="logout()">退出登录</button>
        </div>
    </div>
    <div class="container">
        <div>
            <input type="text" id="name" placeholder="姓名" />
            <select id="parent">
                <option value="">无上级（根节点）</option>
            </select>
            <button class="btn-add" onclick="addPerson()">添加人员</button>
        </div>
        <table>
            <thead>
                <tr><th>ID</th><th>姓名</th><th>上级ID</th><th>操作</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>
    <script>
        const token = localStorage.getItem('token');
        if (!token) location.href = '/login.html';

        async function loadPersons() {
            const res = await fetch('/api/persons');
            const persons = await res.json();
            const list = document.getElementById('list');
            const parent = document.getElementById('parent');
            list.innerHTML = '';
            parent.innerHTML = '<option value="">无上级（根节点）</option>';
            persons.forEach(p => {
                list.innerHTML += `<tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.parent_id || '-'}</td>
                    <td>
                        <button class="btn-del" onclick="deletePerson(${p.id})">删除</button>
                    </td>
                </tr>`;
                parent.innerHTML += `<option value="${p.id}">${p.name}</option>`;
            });
        }

        async function addPerson() {
            const name = document.getElementById('name').value;
            const parent_id = document.getElementById('parent').value;
            if (!name) return alert('请输入姓名');
            await fetch('/api/persons', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ name, parent_id: parent_id || null })
            });
            document.getElementById('name').value = '';
            loadPersons();
        }

        async function deletePerson(id) {
            if (!confirm('确定删除？')) return;
            await fetch(`/api/persons/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            loadPersons();
        }

        function logout() {
            localStorage.removeItem('token');
            location.href = '/login.html';
        }

        loadPersons();
    </script>
</body>
</html>
