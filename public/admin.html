<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · 师徒传承</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-page">
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <h1>管理后台</h1>
        <p id="admin-subtitle">正在验证登录状态…</p>
      </div>
      <div class="header-actions">
        <a class="button" href="./">← 返回图谱</a>
        <button id="logout" class="button" type="button">退出登录</button>
      </div>
    </header>

    <div id="page-message" class="notice hidden" role="status"></div>

    <div class="admin-grid">
      <div>
        <section class="card" id="person-editor">
          <h2 id="editor-title">新增人员</h2>
          <p class="card-subtitle">人员姓名全局唯一；师傅（上游）可以多选。</p>
          <form id="person-form" class="form-grid" novalidate>
            <input id="person-id" type="hidden">
            <div class="field"><label for="person-name">姓名 *</label><input id="person-name" required maxlength="80" placeholder="例如：李明"></div>
            <div class="two-col">
              <div class="field"><label for="person-category">分类</label><input id="person-category" maxlength="80" placeholder="可选"></div>
              <div class="field"><label for="person-avatar">头像 URL</label><input id="person-avatar" type="url" placeholder="可选"></div>
            </div>
            <div class="field">
              <label for="person-masters">师傅（上游，可多选）</label>
              <select id="person-masters" multiple></select>
              <span class="field-hint">按住 Ctrl / ⌘ 可多选；系统会拒绝后代反向设为师傅。</span>
            </div>
            <div class="field"><label for="person-description">简介</label><textarea id="person-description" maxlength="2000" placeholder="可选"></textarea></div>
            <div class="form-actions">
              <button id="save-person" class="button primary" type="submit">添加人员</button>
              <button id="cancel-edit" class="button hidden" type="button">取消编辑</button>
            </div>
            <div id="person-status" class="status-line" aria-live="polite"></div>
          </form>
        </section>

        <section class="card">
          <h2>新增师徒关系</h2>
          <p class="card-subtitle">方向固定为“师傅（上游） → 徒弟（下游）”，重复关系与环路会被拒绝。</p>
          <form id="relationship-form" class="form-grid" novalidate>
            <div class="field"><label for="relationship-master">师傅（上游）</label><select id="relationship-master" required></select></div>
            <div class="field"><label for="relationship-disciple">徒弟（下游）</label><select id="relationship-disciple" required></select></div>
            <div class="form-actions"><button class="button primary" type="submit">添加关系</button></div>
            <div id="relationship-status" class="status-line" aria-live="polite"></div>
          </form>
        </section>

        <section class="card">
          <h2>账号设置</h2>
          <p class="card-subtitle">修改后当前登录 token 仍可使用；下次登录使用新账号信息。</p>
          <form id="account-form" class="form-grid" novalidate>
            <div class="field"><label for="account-username">新用户名</label><input id="account-username" autocomplete="username" placeholder="留空表示不修改"></div>
            <div class="field"><label for="account-password">新密码</label><input id="account-password" type="password" autocomplete="new-password" minlength="8" placeholder="至少 8 位，留空表示不修改"></div>
            <div class="form-actions"><button class="button" type="submit">保存账号设置</button></div>
            <div id="account-status" class="status-line" aria-live="polite"></div>
          </form>
        </section>
      </div>

      <div>
        <section class="card">
          <h2>人员列表 <span id="person-count" class="count-badge"></span></h2>
          <p class="card-subtitle">删除人员只移除本人及其入边、出边，不会级联删除其他人员。</p>
          <div class="field" style="margin-bottom:12px"><label for="person-filter">筛选</label><input id="person-filter" type="search" placeholder="按姓名或分类筛选"></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>人员</th><th>师傅（上游）</th><th>徒弟（下游）</th><th>操作</th></tr></thead>
              <tbody id="person-table"></tbody>
            </table>
          </div>
        </section>

        <section class="card">
          <h2>关系列表 <span id="relationship-count" class="count-badge"></span></h2>
          <p class="card-subtitle">删除关系与删除人员是独立操作。</p>
          <div id="relationship-list"></div>
        </section>
      </div>
    </div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
