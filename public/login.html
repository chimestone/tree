<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 师徒传承关系图谱</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --text-dim: #8b949e;
  --accent: #58a6ff;
  --danger: #f85149;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  width: 90%;
  max-width: 380px;
}
h1 {
  text-align: center;
  margin-bottom: 28px;
  color: var(--text);
  font-size: 22px;
  font-weight: 600;
}
input {
  width: 100%;
  padding: 11px 14px;
  margin: 8px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
input:focus { border-color: var(--accent); }
button {
  width: 100%;
  padding: 11px;
  background: #238636;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 14px;
  transition: opacity 0.15s;
  font-family: inherit;
}
button:hover { opacity: 0.85; }
.error { color: var(--danger); text-align: center; margin-top: 12px; font-size: 13px; min-height: 20px; }
.hint { text-align: center; color: var(--text-dim); font-size: 12px; margin-top: 16px; }
</style>
</head>
<body>
<div class="login-box">
  <h1>师徒传承关系图谱</h1>
  <input type="text" id="username" placeholder="用户名" autocomplete="username" />
  <input type="password" id="password" placeholder="密码" autocomplete="current-password" />
  <button onclick="login()">登 录</button>
  <div class="error" id="error"></div>
  <div class="hint">默认账号 admin / admin123</div>
</div>
<script>
async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token);
      window.location.href = '/admin.html';
    } else {
      document.getElementById('error').textContent = data.error;
    }
  } catch (e) {
    document.getElementById('error').textContent = '登录失败';
  }
}
document.getElementById('password').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
