<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理登录 · 师徒传承</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-mark">师</div>
    <h1>进入管理后台</h1>
    <p class="lead">管理人员资料与师徒关系。公开图谱无需登录。</p>
    <form id="login-form" class="auth-form" novalidate>
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div id="login-message" class="status-line" aria-live="polite"></div>
      <button class="button primary" type="submit">登录</button>
    </form>
    <div class="auth-footer"><span>安全提示：请使用部署环境配置的管理员账号</span><a href="./">返回图谱</a></div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
